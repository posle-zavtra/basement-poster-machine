  for(const r of[...DJ_BUILTIN,...DJREMOTE,...djLocal.get()]){if(!r.hidden&&r.look&&!all.has(r.id))all.set(r.id,r)}

  const cv=d.cvar||({swap:'swap',invert:'invert',flip:'flip'}[d.colour]||'');
