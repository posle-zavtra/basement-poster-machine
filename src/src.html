<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basement Poster Machine</title>
<style>
@font-face{font-family:'Geist';src:url(data:font/ttf;base64,%%GEIST%%) format('truetype');font-weight:100 900;font-style:normal}
@font-face{font-family:'Space Mono';src:url(data:font/ttf;base64,%%SM400%%) format('truetype');font-weight:400;font-style:normal}
@font-face{font-family:'Space Mono';src:url(data:font/ttf;base64,%%SM700%%) format('truetype');font-weight:700;font-style:normal}
:root{--b:#2323d4;--b2:#2323d414;--line:#2323d455;--grid:#2323d412;--bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:11px/1.4 'Space Mono',ui-monospace,monospace;color:var(--b);background:var(--bg);display:grid;grid-template-columns:400px 1fr;height:100vh;overflow:hidden}
#panel{border-right:1px solid var(--b);overflow-y:auto;padding:12px 12px 60px;scrollbar-width:thin}
#brand{display:flex;justify-content:space-between;align-items:flex-end;border:1px solid var(--b);padding:10px;margin-bottom:10px}
#brand b{font-family:'Geist';font-weight:900;font-size:24px;letter-spacing:-.02em;line-height:.9}
#brand span{font-size:10px;text-align:right}
.sec{border:1px solid var(--b);margin-bottom:10px}
.sec h2{display:flex;align-items:center;justify-content:space-between;margin:0;padding:4px 4px 4px 8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--b)}
.sec h2 .hb{display:flex;gap:4px}
.sec h2{cursor:pointer;user-select:none}
.sec h2 .tt{display:flex;align-items:center;gap:6px;min-width:0}
.sec h2 small{font-weight:400;letter-spacing:0;text-transform:none;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.sec h2 .car{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--b);transition:transform .15s}
.sec.closed h2 .car{transform:rotate(-90deg)}
.sec.closed h2{border-bottom:0}
.sec.closed .body{display:none}
.thumb{display:flex;gap:6px;align-items:center}
.thumb img{width:44px;height:44px;object-fit:cover;border:1px solid var(--b)}
.body{padding:4px 0 6px}
.row{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center;padding:3px 8px}
.row.v{grid-template-columns:92px 1fr 44px}
.row label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{text-align:right;font-size:10px}
.row.full{grid-template-columns:1fr}
input[type=text],input[type=date],textarea,select{font:inherit;color:var(--b);border:1px solid var(--line);background:#fff;padding:3px 6px;width:100%;border-radius:0;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--b)}
textarea{resize:vertical;min-height:40px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--b)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--b);margin-top:-5px;cursor:pointer}
input[type=range]::-moz-range-track{height:1px;background:var(--b)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--b)}
input[type=color]{width:100%;height:22px;border:1px solid var(--line);padding:0 2px;background:#fff;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;border-top:1px solid var(--b);border-left:1px solid var(--b)}
.seg button{flex:1 1 auto;font:inherit;color:var(--b);background:#fff;border:0;border-right:1px solid var(--b);border-bottom:1px solid var(--b);padding:3px 6px;cursor:pointer;white-space:nowrap}
.seg button:hover{background:var(--b2)}
.seg button.on{background:var(--b);color:#fff}
.btn{font:inherit;color:var(--b);background:#fff;border:1px solid var(--b);padding:3px 8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--b2)}
.btn.on,.btn.primary{background:var(--b);color:#fff}
.btn.primary:hover{opacity:.9}
.btn:disabled{opacity:.35;cursor:default}
.btn.mini{padding:1px 6px;font-size:10px;font-weight:400;letter-spacing:0;text-transform:none}
.btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;padding:4px 8px}
.hint{padding:2px 8px 4px;font-size:10px;opacity:.75}
#drop{margin:4px 8px;border:1px dashed var(--b);padding:10px;text-align:center;cursor:pointer}
#drop.over{background:var(--b2)}
#fontlist{margin:0 8px;max-height:120px;overflow:auto;font-size:10px}
#fontlist div{display:flex;justify-content:space-between;border-bottom:1px solid var(--grid);padding:1px 0}
#fontlist button{font:inherit;border:0;background:none;color:var(--b);cursor:pointer}
#stage{display:grid;grid-template-rows:auto 1fr auto auto;height:100vh;min-width:0;background-color:#fbfbff;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px}
#bar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--b);background:#fff;flex-wrap:wrap}
#bar .grow{flex:1}
#shuffle{font-size:13px;padding:6px 18px;font-weight:700;letter-spacing:.08em}
#view{display:flex;gap:28px;align-items:center;justify-content:center;padding:18px;overflow:auto;min-height:0}
.frame{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.frame .cap{font-size:10px;display:flex;justify-content:space-between;width:100%}
.frame canvas{display:block;outline:1px solid var(--b);background:#fff}
.lkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 8px}
.lk{position:relative}.lk img{width:100%;display:block;border:1px solid var(--b);cursor:pointer}.lk img:hover{outline:2px solid var(--b)}
.lk button{position:absolute;top:2px;right:2px;font:inherit;font-size:10px;line-height:1;border:1px solid var(--b);background:#fff;color:var(--b);cursor:pointer;padding:1px 4px}
#rate{display:flex;gap:10px;justify-content:space-between;padding:8px 14px 12px}#rate .grp{display:flex;gap:8px;align-items:center}body.dj #rate{justify-content:flex-end}
#rate{align-items:center;flex-wrap:wrap}#rate #like,#rate #dislike,#rate #djsave{font-size:13px;padding:7px 22px;font-weight:700;letter-spacing:.04em}
#codewrap{position:relative}#codetoggle{padding:6px 10px;font-weight:700}#codebox{display:none;position:absolute;bottom:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--b);padding:6px;gap:6px;white-space:nowrap;z-index:5}#codebox.open{display:flex}#code{width:170px;font:inherit;font-size:12px;letter-spacing:.06em;padding:6px 8px;border:1px solid var(--b);color:var(--b)}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chips button{font:inherit;font-size:10px;border:1px solid var(--b);background:#fff;color:var(--b);padding:2px 6px;cursor:pointer}.chips button.on{background:var(--b);color:#fff}
#foot{display:flex;justify-content:space-between;padding:6px 14px;border-top:1px solid var(--b);background:#fff;font-size:10px}
#status{font-weight:700}
#modesw{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
#modesw .seg button{padding:6px;font-weight:700;letter-spacing:.04em}
#modesw .seg button[data-m=designer]::after{content:' 🔒';font-weight:400}
body.unlocked #modesw .seg button[data-m=designer]::after{content:''}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
#lock{position:fixed;inset:0;z-index:50;display:none;place-items:center;overflow:hidden;background:rgba(35,35,212,.55);backdrop-filter:blur(14px) saturate(1.6) contrast(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.6)}
#lock.open{display:grid;animation:lockin .25s steps(4)}
@keyframes lockin{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
#lock::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 4px);pointer-events:none}
#lock .tape{position:absolute;left:-20%;width:140%;height:46px;background:repeating-linear-gradient(-45deg,#fff 0 22px,var(--b) 22px 44px);border-block:3px solid #fff;display:flex;align-items:center;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#lock .tape span{flex:none;white-space:nowrap;font:900 20px/1 'Geist';letter-spacing:.06em;color:var(--b);background:#fff;padding:5px 14px;animation:tape 18s linear infinite}
#lock .tape.t1{top:16%;transform:rotate(-8deg)}#lock .tape.t2{bottom:14%;transform:rotate(6deg)}#lock .tape.t2 span{animation-direction:reverse}
@keyframes tape{to{transform:translateX(-50%)}}
#lock .card{position:relative;background:#fff;border:2px solid var(--b);padding:26px 30px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:12px 12px 0 var(--b);min-width:340px}
#lock .card.bad{animation:shake .4s}
#lock .card h3{margin:0;font:900 44px/.85 'Geist';letter-spacing:-.03em;text-align:center;color:var(--b)}
#lock .card p{margin:0;font-size:10px;text-align:center}
#lock .pins{display:flex;gap:10px;cursor:text}
#lock .pins b{width:58px;height:74px;border:2px solid var(--b);display:grid;place-items:center;font:900 40px 'Geist';color:var(--b);transition:background .1s}
#lock .pins b.f{background:var(--b);color:#fff}#lock .pins b.cur{box-shadow:inset 0 -6px 0 var(--b)}
#lock .card.bad .pins b{border-color:#ff2a1a;background:#ff2a1a;color:#fff}
#lock input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
#lock .back{font:inherit;font-size:10px;color:var(--b);background:none;border:0;text-decoration:underline;cursor:pointer}
body.dj .d-only{display:none!important}
body.dj #foot,body.dj #codewrap{display:none!important}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--b);color:#fff;padding:6px 12px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .2s;z-index:40}#toast.on{opacity:1}
body:not(.dj) .dj-only{display:none!important}
.lk .st{left:2px;right:auto}.lk .st.on{background:var(--b);color:#fff}
.djgrid{grid-template-columns:repeat(4,1fr)}
.djtop{display:grid;grid-template-columns:34px 1fr 34px;gap:6px;align-items:center;padding:4px 8px}.djtop .btn{font-size:16px;padding:2px 0}
.djinfo{text-align:center;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.djrow{display:flex;gap:6px;padding:2px 8px 4px;align-items:center}.djrow .btn:first-child{flex:1;text-align:left}
.djacc{display:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 0;max-height:420px;overflow:auto}.djacc.open{display:block}
.djall{grid-template-columns:repeat(4,1fr)}
.lockv{opacity:.55}
.palgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:4px 8px 6px}
.pal{position:relative;display:grid;grid-template-columns:1fr 1fr;height:34px;border:1px solid var(--b);cursor:pointer}.pal i{display:block}.pal:hover{outline:2px solid var(--b)}.pal.on{outline:3px solid var(--b);outline-offset:1px}
.pal.newpal::after{content:'↻';position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--b);text-shadow:0 0 3px #fff}
.desx{position:absolute;top:-7px;right:-7px;font:inherit;font-size:9px;line-height:1;padding:1px 3px;color:#e8512a;border:1px dashed #e8512a;background:#fff8f5;cursor:pointer}.row.locked{opacity:.55}.row.locked input{cursor:not-allowed}
.btn.icon{font-size:15px;padding:1px 9px}
.btn.desonly{color:#e8512a;border:1px dashed #e8512a;background:#fff8f5}.btn.desonly:hover{background:#ffeee6}
.djrow{display:flex;gap:6px;padding:4px 8px}.djrow .btn{flex:1;text-align:left}.djrow .btn.desonly{flex:none}
.lkgrid>.hint{grid-column:1/-1;padding-left:0}
.lk.dj canvas{width:100%;display:block;border:1px solid var(--b);cursor:pointer;background:#fff}
.lk.dj canvas:hover{outline:2px solid var(--b)}.lk.dj.on canvas{outline:3px solid var(--b);outline-offset:1px}
.lk .nm{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){body{grid-template-columns:1fr;grid-template-rows:58vh 1fr;overflow:auto}#stage{order:-1;height:58vh}#panel{border-right:0;border-top:1px solid var(--b)}}
</style>
</head>
<body>
<aside id="panel">
  <div id="brand"><b>BASEMENT<br>POSTER<br>MACHINE</b><span>v1 · @basement.ldn<br>space = shuffle</span></div>
</aside>
<main id="stage">
  <div id="bar">
    <div class="seg" id="tabs"></div>
    <span class="grow"></span>
    <button class="btn d-only" id="addphoto" title="use your own photo as the art">+ photo</button>
    <button class="btn icon" id="undo" title="undo (cmd+z)">↶</button>
    <button class="btn icon" id="redo" title="redo (shift+cmd+z)">↷</button>
    <button class="btn primary" id="shuffle" title="shuffle everything that isn't locked (space)">SHUFFLE ↻</button>
    <button class="btn" id="dlall" title="download A4 pdf + IG post + IG story as one zip">↓ download all</button>
  </div>
  <div id="view"></div>
  <div id="rate"><div class="grp"><button class="btn d-only" id="djstar" title="send this look to the DJ mode, with its photo">★ send to DJs</button><span id="codewrap"><button class="btn" id="codetoggle" title="poster code: copy or paste a code to reuse this look">#</button><span id="codebox"><input type="text" id="code" placeholder="poster code" spellcheck="false" title="the code for this look. paste a code here and press apply to bring a look back"><button class="btn" id="getcode" title="copy a code for this look">copy code</button><button class="btn" id="copylong" style="display:none" title="a longer code that works on its own, even outside this tool">long code</button><button class="btn" id="usecode" title="apply the code in the box">apply</button></span></span></div><div class="grp"><button class="btn d-only" id="dislike" title="not for me: remember it and shuffle again (key: x)">✕ not for me</button><button class="btn primary d-only" id="like" title="I like this look: save it and teach the shuffle (key: l)">♥ like</button><button class="btn primary dj-only" id="djsave" title="keep this look in your likes">♥ like</button></div></div>
  <div id="foot"><span id="status">ready</span><span class="dj-only">pick a look on the left, fill in your party, download</span><span class="d-only">lock a section to keep it · ↻ on a section shuffles just that part · drop an image here to use it as art</span></div>
</main>
<script>
'use strict';
/* ============ utils ============ */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rng(seed,salt){let h=(seed>>>0)^0x9e3779b9;for(const ch of String(salt))h=Math.imul(h^ch.charCodeAt(0),2654435761)>>>0;return mulberry32(h)}
const pick=(R,a)=>a[Math.floor(R()*a.length)%a.length];
function weighted(R,o){let t=0;for(const k in o)t+=Math.max(0,o[k]);let r=R()*t;for(const k in o){r-=Math.max(0,o[k]);if(r<=0)return k}return Object.keys(o)[0]}
const newSeed=()=>(Math.random()*4294967296)>>>0;
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hsl(h,s,l){h=((h%360)+360)%360;s=clamp(s,0,1);l=clamp(l,0,1);const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return'#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
function hexToRgb(h){h=String(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return[n>>16&255,n>>8&255,n&255]}
function lum(hex){const[r,g,b]=hexToRgb(hex);return(0.2126*r+0.7152*g+0.0722*b)/255}
function mix(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('')}
function rgba(hex,a){const[r,g,b]=hexToRgb(hex);return`rgba(${r},${g},${b},${a})`}
function makeNoise(R){const p=new Float32Array(65536);for(let i=0;i<65536;i++)p[i]=R();const s=t=>t*t*(3-2*t);return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const g=(a,b)=>p[((a&255)<<8)|(b&255)];const u=s(xf),v=s(yf);return lerp(lerp(g(xi,yi),g(xi+1,yi),u),lerp(g(xi,yi+1),g(xi+1,yi+1),u),v)}}
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WDAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* ============ formats ============ */
const FORMATS={
  a4:{label:'A4 print',w:2480,h:3508,safe:{t:.05,b:.05,l:.065,r:.065},k:{info:1,kicker:1,lineup:1,big:1}},
  post:{label:'IG post 4:5',w:1080,h:1350,safe:{t:.055,b:.055,l:.065,r:.065},k:{info:1.45,kicker:1.05,lineup:1.05,big:1}},
  story:{label:'IG story 9:16',w:1080,h:1920,safe:{t:.12,b:.16,l:.075,r:.075},k:{info:1.55,kicker:1.15,lineup:1.15,big:1.1}}
};
const BLEED={w:2551,h:3579};// A4 + 3mm bleed each side at 300dpi

/* ============ fonts ============ */
const FONTS={};
function regFont(id,label,family,weight,tags,src){FONTS[id]={id,label,family,weight,tags,src}}
[['Geist Black',900,'display'],['Geist Bold',700,'display text'],['Geist Regular',400,'text info'],['Geist Thin',100,'display']].forEach(([l,w,t])=>regFont(`b:Geist:${w}`,l,'Geist',w,t,'builtin'));
regFont('b:Space Mono:400','Space Mono','Space Mono',400,'text info','builtin');
regFont('b:Space Mono:700','Space Mono Bold','Space Mono',700,'display text info','builtin');
const GOOGLE=[['UnifrakturMaguntia',400,'display wild'],['Pirata One',400,'display wild'],['Jacquard 24',400,'display wild'],['Rubik Glitch',400,'display wild'],['Rubik Wet Paint',400,'display wild'],['Rubik Puddles',400,'display wild'],['Rubik Burned',400,'display wild'],['Climate Crisis',400,'display'],['Bagel Fat One',400,'display'],['DynaPuff',700,'display wild'],['Monoton',400,'display wild'],['Rampart One',400,'display wild'],['Kablammo',400,'display wild'],['Sedgwick Ave Display',400,'display wild'],['Permanent Marker',400,'display wild'],['Six Caps',400,'display'],['Anton',400,'display'],['Antonio',700,'display text'],['Unbounded',900,'display'],['Syne',800,'display'],['Bricolage Grotesque',800,'display'],['Tilt Warp',400,'display'],['Gloock',400,'display text'],['Instrument Serif',400,'text'],['Fraunces',400,'text'],['Bodoni Moda',400,'text'],['Major Mono Display',400,'display text info'],['Silkscreen',400,'text info'],['VT323',400,'text info'],['Jersey 10',400,'display'],['Oswald',500,'text'],['Bebas Neue',400,'display text'],['IBM Plex Mono',400,'text info'],['Archivo Narrow',500,'text']];
GOOGLE.forEach(([fam,w,t])=>regFont(`g:${fam}`,fam,fam,w,t,'google'));
function loadGoogleLinks(){for(const[fam,w]of GOOGLE){const l=document.createElement('link');l.rel='stylesheet';l.onload=()=>{delete fontTry[`g:${fam}`];scheduleRender()};l.href=`https://fonts.googleapis.com/css2?family=${fam.replace(/ /g,'+')}${w!==400?':wght@'+w:''}&display=block`;document.head.append(l)}}
const F_=id=>FONTS[id]||FONTS['b:Geist:700'];
function font(ctx,f,size){ctx.font=`${f.weight} ${Math.max(1,size).toFixed(2)}px "${f.family}", Geist, sans-serif`}
const loadedFonts=new Set();
const fontTry={};
function ensureFonts(ids){
  const now=Date.now();
  const loads=ids.filter(id=>!loadedFonts.has(id)&&!(fontTry[id]>now-3000)).map(id=>{fontTry[id]=now;const f=F_(id);return document.fonts.load(`${f.weight} 80px "${f.family}"`,'BASEMENT abc 0123').then(r=>{if(r&&r.length){loadedFonts.add(id);return true}return false}).catch(()=>false)});
  if(!loads.length)return Promise.resolve();
  const all=Promise.all(loads);all.then(rs=>{if(rs.some(Boolean))scheduleRender()});
  return Promise.race([all,new Promise(r=>setTimeout(r,2500))]);
}
/* uploaded fonts */
function cleanFontName(n){return n.replace(/^[0-9a-f]{8}-/i,'').replace(/\.(otf|ttf|woff2?|eot)$/i,'').replace(/[_]+/g,' ').trim()}
async function addFont(name,buf,persist=true){
  const id=`u:${name}`;if(FONTS[id])return false;
  const family=`U ${name}`;const ff=new FontFace(family,buf);await ff.load();document.fonts.add(ff);
  regFont(id,name.replace(/-/g,' '),family,400,'display text info','yours');loadedFonts.add(id);
  if(persist)idb.put('fonts',name,buf);return true;
}
async function readZip(buf){
  const dv=new DataView(buf);let e=buf.byteLength-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('not a zip');

  {const thumb=el('div',{className:'thumb'}),pr=el('div',{className:'row'});pr.append(el('label',{textContent:'photo'}),thumb);b.append(pr);photoRows.push(pr);

/* ============ keys + init ============ */
document.addEventListener('keydown',e=>{const t=e.target,typing=/INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if(MODE!=='designer'&&!typing&&(e.code==='Space'||/^[lx]$/i.test(e.key))){if(e.code==='Space'){e.preventDefault();djShuffle()}return}
  if(e.code==='Space'&&!typing){e.preventDefault();shuffle('all')}
  else if(!typing&&!e.metaKey&&!e.ctrlKey&&e.key.toLowerCase()==='l'){rate('like')}
  else if(!typing&&!e.metaKey&&!e.ctrlKey&&e.key.toLowerCase()==='x'){rate('dislike')}
  else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo()}});
